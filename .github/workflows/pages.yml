name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Refresh the data snapshot twice a day. The board is only as current as its
  # last capture, and during the season the numbers move daily — without this the
  # site would silently serve whatever was true at the last code push.
  # 11:00 UTC ≈ 07:00 ET, after every previous-day game is final.
  # 23:00 UTC ≈ 19:00 ET, picking up day games and afternoon roster moves.
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # capture live MLB + Savant data; the browser can't call them directly
      # (neither sends CORS headers), so the snapshot is how real data ships
      - run: pnpm refresh
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
